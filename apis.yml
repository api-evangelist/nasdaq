description: 'Nasdaq, Inc. operates the Nasdaq stock exchanges and sells market data, index, and financial technology products. Its developer
  surface is Nasdaq Data Link (data.nasdaq.com): a Tables API (REST, api_key, JSON/XML/CSV, 10,000-row pages with cursor and bulk export), a Bulk
  Download API, a request-based REST API for real-time and delayed equities, indexes, ETPs and options (Nasdaq Cloud Data Service, OAuth client-credentials,
  customer-specific base URL), and a Kafka-based Streaming API delivered through first-party Java and Python SDKs.'
