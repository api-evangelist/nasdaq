- name: Nasdaq Data Link Tables API
  description: 'REST access to Nasdaq Data Link tabular datasets: GET /api/v3/datatables/{datatable_code}.{format} with row and column filters
    (qopts.columns), cursor pagination (qopts.cursor_id), metadata, and bulk export (qopts.export=true). Authenticated with an api_key query parameter;
    anonymous access is rate limited.'
  humanURL: https://data.nasdaq.com/tablesapi
  baseURL: https://data.nasdaq.com/api/v3
  tags:
  - Market Data
  - Datasets
  - REST
  properties:
  - type: SDKs
    url: https://github.com/Nasdaq/data-link-python
  aid: nasdaq:nasdaq-data-link-tables-api
- name: Nasdaq Data Link Bulk Download API
  description: 'Asynchronous bulk download of Nasdaq Data Link tables: GET /api/v1/bulkdownloads/{datatable_code} with row filters returns a job
    (PENDING, RUNNING, SUCCEEDED...) and file URLs fetched with the X-Api-Token header. Limited to 30 requests per table per day.'
  humanURL: https://data.nasdaq.com/tablesapi
  baseURL: https://data.nasdaq.com/api/v1
  tags:
  - Market Data
  - Bulk Data
  - REST
  properties: []
  aid: nasdaq:nasdaq-data-link-bulk-download-api
- name: Nasdaq Cloud Data Service (NCDS) REST API
  description: Request-based REST API for real-time and delayed Nasdaq, BX, PSX and CQT equities (last sale, last trade, last quote, snapshot,
    trends, bars), indexes, ETPs and options chains/prices, plus reference data. OAuth-style client credentials exchanged at POST /v1/auth/token
    for a bearer token; the base URL is customer-specific and issued during onboarding.
  humanURL: https://github.com/Nasdaq/NasdaqCloudDataService-REST-API
  baseURL: https://{base_url}/v1
